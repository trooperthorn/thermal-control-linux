# Example configuration for MediaIn-SVR.
#
# Measured on MediaIn-SVR on 2026-10-03 (see UNVERIFIED.md): the chips are acpitz, nct6779,
# asus and coretemp, and the fan chip is nct6779 with pwm1 to pwm4 driving 4-pin fans and
# pwm5 having no fan fitted. The hwmonN index can change across boots, so paths name the
# chip and file (for example nct6779:pwm2) and the service resolves them to the current
# hwmonN directory at start. If a chip is not found the service refuses to start and
# touches no fan.
#
# UNVERIFIED: which fan each header drives has not been tested, and coretemp:temp1_input
# is assumed to be the CPU package sensor. Until a header has passed the supervised
# mapping test (thermalctl map-headers), keep mapped = false and the service will not
# control it.
#
# pwm5 is deliberately absent: no fan is fitted to it, so it is never mapped and never
# controlled. Do not add it.

# dry_run computes and logs only. Change to "active" only after mapping is proven, and
# restart the service afterwards: a reload cannot switch from dry_run to active or map a
# new header.
mode = "dry_run"

[[zones]]
id = "cpu"
# Chip reference, resolved at start. UNVERIFIED that temp1_input is the CPU package.
temperature_input = "coretemp:temp1_input"
# The only supported load input name, read from /proc/stat by the service.
load_input = "cpu_load_percent"
# Points are [temperature in C, duty percent]. Quiet when cool, full at 80 C.
temperature_curve = [[40, 20], [55, 35], [70, 70], [80, 100]]
# Points are [load percent, duty percent]. Load can raise the duty, never lower it.
load_curve = [[0, 0], [50, 30], [90, 100]]
hard_max_temp_c = 90
# A reading older than this many seconds (the sensor could not be read in time) counts as
# stale and sends the fans to full speed.
stale_after_s = 10
# A sensor whose value has not changed for this long counts as frozen and also sends the
# fans to full speed. It is far longer than stale_after_s because a quiet host can hold one
# reading for minutes. 900 seconds (15 minutes) is the default; its basis is in UNVERIFIED.md.
frozen_after_s = 900

[[headers]]
id = "pwm1"
# Chip reference, resolved at start.
path = "nct6779:pwm1"
mapped = false
min_duty = 20
# Set min_rpm to 0 for a fan that may legitimately stop; this turns the RPM floor off.
min_rpm = 300
# The RPM floor applies only while the commanded duty is at or above this percentage.
min_rpm_duty = 50
stall_window_s = 15
zones = ["cpu"]

[[headers]]
id = "pwm2"
# Chip reference, resolved at start.
path = "nct6779:pwm2"
mapped = false
min_duty = 20
# Set min_rpm to 0 for a fan that may legitimately stop; this turns the RPM floor off.
min_rpm = 300
# The RPM floor applies only while the commanded duty is at or above this percentage.
min_rpm_duty = 50
stall_window_s = 15
zones = ["cpu"]

