[project]
name = "thermal-control-linux"
version = "0.1.0"
description = "Fail-safe, load-aware fan control for Linux hosts, watched by hostwatch"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
thermalctl = "thermalctl.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["thermalctl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
